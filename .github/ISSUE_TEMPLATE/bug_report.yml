name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not attach source code you cannot share. A small ZIP that reproduces the problem is ideal.
        For security problems, use private vulnerability reporting instead of this form.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what actually happened.
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Input
      description: Project type, approximate size, and whether it came from a ZIP, a GitHub download, or an export file.
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Browser console errors
      render: text
